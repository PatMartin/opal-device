[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opal_device"]

[project]
name = "opal-device"
version = "0.1.0"
description = "OPAL Devices registry service (contract opal_device_v1.7.1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "PyYAML>=6.0.1",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
opal-device = "opal_device.cli:app"
opal-device-audit = "opal_device.contract_audit:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
